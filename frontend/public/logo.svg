<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Modern Blue Gradient matching your app's theme -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6; stop-opacity:1" /> <!-- Lighter Blue -->
      <stop offset="100%" style="stop-color:#1d4ed8; stop-opacity:1" /> <!-- Darker Blue -->
    </linearGradient>
  </defs>
  
  <!-- Background App Icon Shape -->
  <rect width="512" height="512" rx="120" fill="url(#blueGradient)" />
  
  <!-- The Bridge Arch -->
  <path d="M130 350 Q256 160 382 350" fill="none" stroke="#ffffff" stroke-width="48" stroke-linecap="round" />
  
  <!-- Bridge Pillars -->
  <line x1="200" y1="280" x2="200" y2="420" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />
  <line x1="312" y1="280" x2="312" y2="420" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />
  
  <!-- Success / Career Sun or Head -->
  <circle cx="256" cy="140" r="36" fill="#fcd34d" />
</svg>
